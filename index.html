<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cloud Kitchen · 3D Walkthrough</title>
</head>
<body>
  <header><b>Cloud Kitchen</b><span>4,000 sq ft · 100′ × 40′</span></header>
  <div id="legend">
    <i style="background:#e0483e"></i>Non-Veg
    <i style="background:#4fb477"></i>Veg
    <i style="background:#f7c948"></i>Jain
  </div>
  <section id="panel">
    <div><span id="count"></span></div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <nav>
      <button id="prev">←</button>
      <button id="auto">▶ Auto</button>
      <button id="next">→</button>
      <button id="rec">● Rec</button>
    </nav>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
